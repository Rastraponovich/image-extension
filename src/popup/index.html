<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="toolbar">
      <input type="file" id="fileInput" accept="image/*" style="display: none" />
      <button type="button" id="btnFile" title="Загрузить файл">📁</button>
      <select id="aspectRatio">
        <option value="NaN">Свободно</option>
        <option value="1">1:1 (Квадрат)</option>
        <option value="1.7777777777777777">16:9</option>
        <option value="0.75">3:4</option>
        <option value="1.5">3:2</option>
      </select>
      <button type="button" id="rotateLeft" title="Поворот -90°">↺</button>
      <button type="button" id="rotateRight" title="Поворот +90°">↻</button>
      <button type="button" id="flipX" title="Отразить">↔</button>
      <button type="button" id="clearBtn" title="Очистить">🗑 Очистить</button>
    </div>

    <div class="container">
      <img id="image" alt="" />
    </div>

    <div id="sizeDisplay" class="info">Размер: 0 x 0 px</div>

    <div class="settings-row">
      <label class="checkbox-label">
        <input type="checkbox" id="customFormat" />
        Изменить формат вывода
      </label>
      <span id="formatBox" class="format-box" style="display: none">
        <label>
          Формат:
          <select id="format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </label>
        <span id="qualityBox" style="display: none">
          Качество: <input type="range" id="quality" min="0.1" max="1.0" step="0.1" value="0.9" />
        </span>
      </span>
    </div>

    <div style="margin-top: 15px; display: flex; gap: 8px">
      <button type="button" id="saveBtn" class="btn-primary">СКАЧАТЬ РЕЗУЛЬТАТ</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
